name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Regenerate npm lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Regenerate Bun lockfile
        run: bun install
      - name: Verify clean npm install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Tests
        run: npm test
      - name: Commit synchronized lockfiles
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(deps): synchronize lockfiles"
          file_pattern: package-lock.json bun.lock
