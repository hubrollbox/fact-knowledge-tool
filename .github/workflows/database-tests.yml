name: Supabase Database Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  database-tests:
    name: FKT Vet database tests (local)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # No login, link, project token or database password is used.
      # db start and --local keep all database operations on the CI runner.
      - name: Start local Supabase database
        run: supabase db start

      - name: Rebuild local database from repository migrations
        run: supabase db reset --local

      - name: Run pgTAP database tests
        run: supabase test db --local

      - name: Stop local Supabase services
        if: always()
        run: supabase stop --no-backup
