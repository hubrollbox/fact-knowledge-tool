name: Supabase Database Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  database-tests:
    name: FKT Vet database tests (local)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.2.0

      # No login, link, project token or database password is used.
      # The CLI v3 local target is explicit in every database command.
      - name: Start local Supabase services
        run: supabase start -x studio,mailpit,storage-api,imgproxy,edge-runtime,logflare,vector,realtime,kong,postgrest,postgres-meta,supavisor

      - name: Rebuild local database from repository migrations
        run: supabase db reset --local

      - name: Run pgTAP database tests
        run: supabase test db --local

      - name: Stop local Supabase services
        if: always()
        run: supabase stop --no-backup
