name: Supabase Database Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  database-tests:
    name: FKT Vet database tests (local)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        id: setup_supabase
        uses: supabase/setup-cli@v1
        with:
          # Pin the CLI version: "latest" requires a GitHub release lookup
          # and previously failed due to the unauthenticated API rate limit.
          version: 3.2.0

      # No login, link, project token or database password is used.
      # db start and --local keep all database operations on the CI runner.
      - name: Start local Supabase database
        run: supabase db start

      - name: Rebuild local database from repository migrations
        run: supabase db reset --local

      - name: Verify FKT Vet migration #75 is repeatable
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' --set ON_ERROR_STOP=1 --file supabase/migrations/20261120183029_fkt_vet_workspace_integrity_and_history.sql

      - name: Verify FKT Works daily diary migration is repeatable
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' --set ON_ERROR_STOP=1 --file supabase/migrations/20261125213948_fkt_works_daily_site_diary.sql

      - name: Verify FKT Works diary author migration is repeatable with legacy rows
        run: |
          DB_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          psql "$DB_URL" --set ON_ERROR_STOP=1 --file supabase/migrations/20261127090000_fkt_works_diary_author_snapshot.sql
          psql "$DB_URL" --set ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO auth.users (id,aud,role,email,raw_user_meta_data,created_at,updated_at)
          VALUES ('a4900000-0000-4000-8000-000000000001','authenticated','authenticated','fkt-works-author-backfill@example.test','{"full_name":"Autor Migração CI"}'::jsonb,now(),now());
          INSERT INTO public.workspaces (id,user_id,modulo,name)
          VALUES ('b4900000-0000-4000-8000-000000000001','a4900000-0000-4000-8000-000000000001','obras','FKT Works author migration test');
          INSERT INTO public.obras (id,workspace_id,nome)
          VALUES ('c4900000-0000-4000-8000-000000000001','b4900000-0000-4000-8000-000000000001','Obra migração CI');
          INSERT INTO public.obras_visitas (id,workspace_id,obra_id,data_visita,created_by)
          VALUES ('d4900000-0000-4000-8000-000000000001','b4900000-0000-4000-8000-000000000001','c4900000-0000-4000-8000-000000000001',current_date,'a4900000-0000-4000-8000-000000000001');
          SQL
          psql "$DB_URL" --set ON_ERROR_STOP=1 --file supabase/migrations/20261127090000_fkt_works_diary_author_snapshot.sql
          psql "$DB_URL" --set ON_ERROR_STOP=1 <<'SQL'
          psql "$DB_URL" --set ON_ERROR_STOP=1 --command "SELECT 1 / CASE WHEN (SELECT created_by_name FROM public.obras_visitas WHERE id='d4900000-0000-4000-8000-000000000001') IS NOT DISTINCT FROM 'Autor Migração CI' THEN 1 ELSE 0 END"
          DELETE FROM public.obras_visitas WHERE id='d4900000-0000-4000-8000-000000000001';
          DELETE FROM public.obras WHERE id='c4900000-0000-4000-8000-000000000001';
          DELETE FROM public.workspaces WHERE id='b4900000-0000-4000-8000-000000000001';
          DELETE FROM auth.users WHERE id='a4900000-0000-4000-8000-000000000001';
          SQL

      - name: Run pgTAP database tests
        run: supabase test db --local

      - name: Stop local Supabase services
        if: always() && steps.setup_supabase.outcome == 'success'
        run: supabase stop --no-backup
